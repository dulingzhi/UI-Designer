<!doctype html><html><body>
<canvas id="c" width="64" height="64"></canvas>
<script>
(async () => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  const out = document.getElementById('out');
  if (!gl) { out.textContent = 'NO_GL'; done(); return; }
  const info = gl.getParameter(gl.RENDERER);
  const vsSrc = 'void main(){ gl_Position = vec4(position,1.0); }';
  const fsSrc = 'precision mediump float; varying vec2 vUV; void main(){ gl_FragColor = vec4(vUV, 0.5, 1.0); }';
  // setup simple fullscreen triangle with UV varying
  const make = (type, src) => { const s=gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  const vs = make(gl.VERTEX_SHADER, vsSrc);
  const fs = make(gl.FRAGMENT_SHADER, fsSrc);
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'position'); gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0,0,64,64);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const px = new Uint8Array(64*64*4);
  gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,px);
  out.textContent = JSON.stringify({ renderer: info, valid: gl.getError()===0, hash: simpleHash(px), sample: Array.from(px.slice(0,16)) });
  done();
  function simpleHash(u8){ let h=5381; for(let i=0;i<u8.length;i+=4){ h=((h<<5)+h+u8[i])>>>0; } return h; }
})();
function done(){ window.__probeDone = true; }
</script><div id="out">PENDING</div></body></html>
